<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pedro Henrique Assis Ventura — Senior LLM Engineer & AI Systems Architect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090A0B"/>
      <stop offset="0.55" stop-color="#0D0E10"/>
      <stop offset="1" stop-color="#151618"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A2FF60" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A2FF60"/>
      <stop offset="1" stop-color="#A2FF60" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line2" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AADFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7AADFF"/>
      <stop offset="1" stop-color="#7AADFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 30) rotate(135) scale(420 500)">
      <stop stop-color="#A2FF60" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#A2FF60" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 320) rotate(20) scale(360 360)">
      <stop stop-color="#7AADFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7AADFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#F0F0EE" stroke-opacity="0.04"/>
    </pattern>
    <filter id="blurSm"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blurLg"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="textGlow"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow1)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow2)"/>

  <g opacity="0.20">
    <circle cx="1020" cy="62" r="92" fill="#A2FF60" filter="url(#blurLg)"/>
    <circle cx="180" cy="280" r="110" fill="#7AADFF" filter="url(#blurLg)"/>
  </g>

  <g opacity="0.85">
    <circle cx="1032" cy="62" r="3.4" fill="#A2FF60"/>
    <circle cx="1098" cy="118" r="2.4" fill="#A2FF60" fill-opacity="0.8"/>
    <circle cx="970" cy="142" r="2.2" fill="#A2FF60" fill-opacity="0.7"/>
    <circle cx="1086" cy="42" r="1.8" fill="#A2FF60" fill-opacity="0.6"/>
    <circle cx="950" cy="62" r="1.6" fill="#A2FF60" fill-opacity="0.6"/>
  </g>

  <g stroke="#F0F0EE" stroke-opacity="0.10" fill="none" stroke-linecap="round">
    <path d="M0 280C190 240 290 320 492 274C720 222 811 124 1200 178">
      <animate attributeName="d"
        dur="9s" repeatCount="indefinite"
        values="
          M0 280C190 240 290 320 492 274C720 222 811 124 1200 178;
          M0 268C200 256 314 298 504 286C728 256 882 142 1200 192;
          M0 280C190 240 290 320 492 274C720 222 811 124 1200 178"
        calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;0.5;1"/>
    </path>
    <path d="M0 301C212 263 314 344 519 294C728 244 861 146 1200 199" stroke="url(#line2)" stroke-opacity="0.28">
      <animate attributeName="d"
        dur="11s" repeatCount="indefinite"
        values="
          M0 301C212 263 314 344 519 294C728 244 861 146 1200 199;
          M0 312C232 286 340 322 530 304C740 280 880 168 1200 216;
          M0 301C212 263 314 344 519 294C728 244 861 146 1200 199"
        calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" keyTimes="0;0.5;1"/>
    </path>
  </g>

  <g transform="translate(960 220)" opacity="0.95">
    <circle r="92" fill="none" stroke="#A2FF60" stroke-opacity="0.18"/>
    <circle r="64" fill="none" stroke="#A2FF60" stroke-opacity="0.28"/>
    <circle r="36" fill="none" stroke="#A2FF60" stroke-opacity="0.42"/>
    <circle cx="0" cy="0" r="6" fill="#F0F0EE"/>
    <g>
      <g>
        <circle cx="0" cy="-36" r="3.4" fill="#A2FF60"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="0" cy="-64" r="2.6" fill="#7AADFF"/>
        <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="22s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="0" cy="-92" r="2.2" fill="#89F43D"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="30s" repeatCount="indefinite"/>
      </g>
    </g>
    <text x="0" y="120" text-anchor="middle" fill="#B6B7B9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">LLM · AGENTS · SYSTEMS</text>
  </g>

  <g transform="translate(72 66)">
    <rect width="120" height="6" rx="3" fill="#A2FF60">
      <animate attributeName="width" values="120;160;120" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial, sans-serif" fill="#F0F0EE" font-weight="700" font-size="44">
    <text x="72" y="138">Pedro Henrique</text>
    <text x="72" y="184">Assis Ventura</text>
    <g filter="url(#textGlow)" opacity="0.5">
      <text x="72" y="138" fill="#A2FF60">Pedro Henrique</text>
      <text x="72" y="184" fill="#A2FF60">Assis Ventura</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial, sans-serif">
    <text x="74" y="226" fill="#B6B7B9" font-size="16" letter-spacing="3">SENIOR LLM ENGINEER  ·  AI SYSTEMS ARCHITECT</text>
    <text x="74" y="278" fill="#F0F0EE" font-size="16">Building the layer between intelligence and execution.</text>
    <text x="74" y="302" fill="#6E7077" font-size="13">Agentes · Retrieval · SaaS · Operações reais</text>
  </g>

  <g transform="translate(74 326)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <g>
      <rect width="9" height="14" rx="2" fill="#A2FF60">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="14" width="9" height="14" rx="2" fill="#A2FF60" opacity="0.7">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.15s" repeatCount="indefinite"/>
      </rect>
      <rect x="28" width="9" height="14" rx="2" fill="#A2FF60" opacity="0.5">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="48" y="12" fill="#B6B7B9">prompt.compile(model="phventura")</text>
  </g>

  <g transform="translate(720 296)">
    <rect width="200" height="44" rx="22" fill="#0D0E10" stroke="#A2FF60" stroke-opacity="0.55"/>
    <circle cx="22" cy="22" r="7" fill="#A2FF60"/>
    <circle cx="22" cy="22" r="12" fill="#A2FF60" fill-opacity="0.3">
      <animate attributeName="r" values="8;18;8" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="27" fill="#F0F0EE" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600">pedroventura.com.br →</text>
  </g>

  <rect x="6" y="6" width="1188" height="348" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
</svg>
